apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api-blue
  namespace: notes-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-api-release
      track: blue
  template:
    metadata:
      labels:
        app: notes-api-release
        track: blue
    spec:
      containers:
        - name: notes-api
          image: notes-api:lesson40
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: notes-api-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: notes-api-config
                  key: PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: notes-api-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: notes-api-config
                  key: DB_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: notes-api-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: notes-api-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-api-secret
                  key: POSTGRES_PASSWORD
            - name: DEMO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notes-api-secret
                  key: DEMO_API_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
