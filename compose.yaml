
services:
  app:
    build: .
    container_name: devops-node-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      INSTANCE_NAME: app-1
      TRUST_PROXY: "1"
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  app2:
    build: .
    container_name: devops-node-app-2
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      INSTANCE_NAME: app-2
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy

  app3:
    build: .
    container_name: devops-node-app-3
    environment:
      PORT: 3000
      INSTANCE_NAME: app-3
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  demo:
    image: hashicorp/http-echo:1.0.0
    container_name: devops-demo
    command:
      - "-listen=:4000"
      - "-text=Hello from the second backend!"
    expose:
      - "4000"

  nginx:
    image: nginx:alpine
    container_name: devops-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - app
      - app2
      - demo
      - app3
  db:
    image: postgres:17-alpine
    container_name: devops-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
