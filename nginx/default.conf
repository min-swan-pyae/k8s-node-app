# Docker's embedded DNS resolver
resolver 127.0.0.11 valid=5s ipv6=off;

upstream node_backend {    

    zone node_backend 64k;

    server app:3000 weight=3 resolve max_fails=2 fail_timeout=10s;
    server app2:3000 weight=1 resolve max_fails=2 fail_timeout=10s;
    server app3:3000 backup resolve;
}

upstream demo_backend {
    zone demo_backend 64k;

    server demo:4000 resolve;
}

server {
    listen 80;
    server_name localhost;

    location /demo/ {
        proxy_pass http://demo_backend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "Nginx is healthy\n";
    }
}
