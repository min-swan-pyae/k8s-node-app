
name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Validate and test Node.js app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check application syntax
        run: |
          node --check app.js
          node --check app.test.js

      - name: Run automated tests
        run: node --test

      - name: Build Docker image
        run: docker build -t k8s-node-app:${{ github.sha }} .

      - name: Verify demo secret is configured
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          if [ -z "$DEMO_API_TOKEN" ]; then
            echo "Demo secret is missing"
            exit 1
          fi
          echo "Demo secret is configured"
