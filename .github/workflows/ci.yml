
name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Validate and test Node.js app
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devops_db
          POSTGRES_USER: devops_user
          POSTGRES_PASSWORD: devops_training_password_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops_user -d devops_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      POSTGRES_DB: devops_db
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_training_password_2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check application syntax
        run: |
          node --check app.js
          node --check app.test.js

      - name: Run automated tests
        run: node --test

      - name: Build Docker image
        run: docker build -t k8s-node-app:${{ github.sha }} .

      - name: Verify demo secret is configured
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          if [ -z "$DEMO_API_TOKEN" ]; then
            echo "Demo secret is missing"
            exit 1
          fi
          echo "Demo secret is configured"
