
name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Validate and test Node.js app
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devops_db
          POSTGRES_USER: devops_user
          POSTGRES_PASSWORD: devops_training_password_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops_user -d devops_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      POSTGRES_DB: devops_db
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_training_password_2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check application syntax
        run: |
          node --check app.js
          node --check app.test.js
          node --check scripts/migrate.js

      - name: Run automated tests
        run: node --test

      - name: Build Docker image
        run: docker build -t k8s-node-app:${{ github.sha }} .

      - name: Verify demo secret is configured
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          if [ -z "$DEMO_API_TOKEN" ]; then
            echo "Demo secret is missing"
            exit 1
          fi
          echo "Demo secret is configured"
  validate-kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.0"
      - name: Install Kubeconform
        run: |
          curl -fL -o /tmp/kubeconform.tar.gz \
            "https://sourceforge.net/projects/kubeconform.mirror/files/v0.8.0/kubeconform-linux-amd64.tar.gz/download"

          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz" | sha256sum -c -

          mkdir -p /tmp/kubeconform-install
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp/kubeconform-install
          sudo install -m 755 /tmp/kubeconform-install/kubeconform /usr/local/bin/kubeconform

      - name: Build Kubernetes manifests with Kustomize
        run: kubectl kustomize k8s/ > /tmp/rendered-manifests.yaml

      - name: Verify rendered manifests are not empty
        run: |
          if [ ! -s /tmp/rendered-manifests.yaml ]; then
            echo "Kustomize generated an empty manifest"
            exit 1
          fi
          echo "Kustomize successfully generated Kubernetes manifests"

      - name: Validate Kustomize resources
        run: kubeconform -strict -summary /tmp/rendered-manifests.yaml

      - name: Validate Blue-Green and Canary resources
        run: |
          kubeconform -strict -summary \
            k8s/blue-green.yaml \
            k8s/canary.yaml \
            k8s/canary-nginx.yaml
